            .subcategory-card img { width: 44px; height: 44px; flex-basis: 44px; border-radius: 9px; }
            .pagination { gap: 6px; padding: 0 12px; }

        @media (max-width: 480px) {

            .categories-bar::-webkit-scrollbar { height: 5px; }

            .category-item { flex: 0 0 auto; }

            .article-info p { display: none; }
            .subcategory-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a class="header-logo-link" href="./index.html" aria-label="الرئيسية">
            <img class="header-logo" src="./assets/site-logo.png" alt="شعار الموقع">
        </a>
        <form class="search-area" id="search-area">
            <input id="search-input" type="search" placeholder="ابحث" aria-label="البحث">
            <button type="submit">بحث</button>
        </form>
        <div class="header-actions">
        <button class="search-btn" title="بحث">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
        </div>
        <button class="install-btn" id="install-btn" type="button">تثبيت التطبيق</button>
    </div>
    <div class="categories-bar" id="categories-bar"></div>
    <div class="latest-ticker" id="latest-ticker" aria-label="آخر المواضيع" hidden>
        <div class="latest-ticker-window"><div class="latest-ticker-track" id="latest-ticker-track"></div></div>
    </div>
    <div class="main-story" id="main-story" style="display: none;"></div>
    <div class="featured-reel" id="featured-reel" aria-label="آخر المواضيع"></div>
    <div class="subcategory-cards" id="subcategory-cards"></div>
    <div class="home-category-sections" id="home-category-sections"></div>
    <div class="grid-container" id="articles-grid"></div>
    <div class="pagination" id="pagination"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMxtNOaCVEKQzUA1bigwvQGzGp18PV184",
            authDomain: "alfaham-tube-web.firebaseapp.com",
            databaseURL: "https://alfaham-tube-web-default-rtdb.firebaseio.com",
            projectId: "alfaham-tube-web",
            storageBucket: "alfaham-tube-web.firebasestorage.app",
            messagingSenderId: "999387437014",
            appId: "1:999387437014:web:5d5cc66098e267aab07677",
            measurementId: "G-9BEMHM5MPE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const fallbackImage = 'https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfaham%20tube%201.png';
        let allArticles = [];
        let allCategories = [];
        let featuredVideo = null;
        let deferredInstallPrompt = null;

        function setupInstallPrompt() {
            const installButton = document.getElementById('install-btn');
            if (!installButton) return;
            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                deferredInstallPrompt = event;
                installButton.classList.add('visible');
            });
            installButton.addEventListener('click', async () => {
                if (!deferredInstallPrompt) return;
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                installButton.classList.remove('visible');
            });
            window.addEventListener('appinstalled', () => installButton.classList.remove('visible'));
        }

        function normalizeArticles(snapshot) {
            if (!snapshot || !snapshot.exists()) return [];
            const data = snapshot.val() || {};
            return Object.entries(data)
                .map(([id, value]) => ({ id, ...(value || {}) }))
                .sort(sortByNewest);
        }

        function sortByNewest(first, second) {
            return Number(second.createdAt || 0) - Number(first.createdAt || 0);
        }

        function isPinned(article) {
            return article.pinned === true || article.pinned === 'true' || article.pinned === 1;
        }

        function isPinnedVideo(article) {
            return article.videoPinned === true || article.videoPinned === 'true' || article.videoPinned === 1;
        }

        function getYoutubeVideoId(url) {
            if (!url) return '';
            try {
                const parsedUrl = new URL(String(url).trim());
                const hostname = parsedUrl.hostname.toLowerCase();
                if (hostname === 'youtu.be') return parsedUrl.pathname.slice(1).split('/')[0];
                if (!hostname.includes('youtube.com')) return '';
                if (parsedUrl.pathname === '/watch') return parsedUrl.searchParams.get('v') || '';
                const pathParts = parsedUrl.pathname.split('/').filter(Boolean);
                if (['shorts', 'live', 'embed'].includes(pathParts[0])) return pathParts[1] || '';
            } catch (error) {
                return '';
            }
            return '';
        }

        function getArticleImage(article) {
            const directImage = String(article.imageUrl || '').trim();
            if (directImage) return directImage;

            const videoUrls = Array.isArray(article.videoUrls) && article.videoUrls.length
                ? article.videoUrls
                : (article.videoUrl ? [article.videoUrl] : []);
            const youtubeId = videoUrls.map(getYoutubeVideoId).find(Boolean);
            if (youtubeId) return `https://img.youtube.com/vi/${encodeURIComponent(youtubeId)}/hqdefault.jpg`;

            return fallbackImage;
        }

        function getArticleImageHtml(article, title) {
            const image = getArticleImage(article);
            return `<img src="${image}" alt="${title}" onerror="this.onerror=null;this.src='${fallbackImage}';">`;
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        }

        function getArticlePreview(content, maxLength = 110) {
            const previewElement = document.createElement('div');
            previewElement.innerHTML = String(content || '');
            const text = (previewElement.textContent || previewElement.innerText || '')
                .replace(/\s+/g, ' ')
                .trim();
            return text.length > maxLength ? `${text.slice(0, maxLength).trim()}...` : text;
        }

        function renderLatestTicker(articles) {
            const latest = articles.slice(0, 10);
            const links = latest.length
                ? latest.map((article) => `<a class="latest-ticker-link" href="${escapeHtml(getArticleHref(article))}">${escapeHtml(article.title || 'موضوع جديد')}</a>`).join('')
                : '<span class="latest-ticker-link">لا توجد مواضيع منشورة حاليًا</span>';
            document.querySelectorAll('.latest-ticker').forEach((ticker) => {
                const track = ticker.querySelector('.latest-ticker-track');
                if (!track) return;
                track.innerHTML = links + links;
                ticker.hidden = false;
            });
        }
        function shuffleArray(items) {
            const cloned = [...items];
            for (let index = cloned.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [cloned[index], cloned[randomIndex]] = [cloned[randomIndex], cloned[index]];
            }
            return cloned;
        }

        function renderFeaturedReel(articles) {
            if (selectedCategory !== 'home') {
                const reel = document.getElementById('featured-reel');
                if (reel) reel.remove();
                return;
            }

            const reel = document.getElementById('featured-reel');
            if (!reel) return;

            const maxPerCategory = 2;
            const maxTotal = 10;
            const categoryPool = shuffleArray(allCategories.filter((category) => {
                const ids = getCategoryFilters(category.id) || new Set([category.id]);
                return articles.some((article) => ids.has(article.categoryId));
            }));

            let deck = [];
            for (const category of categoryPool) {
                const ids = getCategoryFilters(category.id) || new Set([category.id]);
                const categoryArticles = shuffleArray(articles.filter((article) => ids.has(article.categoryId)));
                if (!categoryArticles.length) continue;
                deck.push(...categoryArticles.slice(0, maxPerCategory));
                if (deck.length >= maxTotal) break;
            }

            if (!deck.length) {
                deck = shuffleArray((articles || []).slice(0, maxTotal));
            }

            const finalDeck = shuffleArray(deck).slice(0, maxTotal);
            if (!finalDeck.length) {
                reel.innerHTML = '';
                return;
            }

            reel.innerHTML = `
                <div class="featured-reel-window">
                    <div class="featured-reel-track" id="featured-reel-track" dir="rtl">
                        ${finalDeck.map((article) => `
                            <a href="${escapeHtml(getArticleHref(article))}" class="featured-slide" aria-label="${escapeHtml(article.title || 'موضوع مميز')}">
                                <img class="featured-slide-image" src="${escapeHtml(getArticleImage(article))}" alt="${escapeHtml(article.title || 'موضوع مميز')}" loading="eager" decoding="async" onerror="this.onerror=null;this.src='${fallbackImage}';this.classList.add('loaded');">
                                <div class="featured-caption">${escapeHtml(article.title || 'موضوع مميز')}</div>
                            </a>
                        `).join('')}
                    </div>
                </div>
                <div class="featured-reel-controls">
                    <button class="featured-reel-nav" type="button" data-dir="prev" aria-label="السابق">‹</button>
                    <div class="featured-reel-dots">
                        ${finalDeck.map((_, index) => `<span class="featured-reel-dot ${index === 0 ? 'active' : ''}" data-index="${index}"></span>`).join('')}
                    </div>
                    <button class="featured-reel-nav" type="button" data-dir="next" aria-label="التالي">›</button>
                </div>
            `;

            const track = document.getElementById('featured-reel-track');
            const dots = Array.from(document.querySelectorAll('.featured-reel-dot'));
            const navButtons = Array.from(document.querySelectorAll('.featured-reel-nav'));
            if (!track || !dots.length) return;

            const slideImages = Array.from(track.querySelectorAll('.featured-slide-image'));
            slideImages.forEach((image) => {
                const activate = () => { image.classList.add('loaded'); };
                if (image.complete) {
                    activate();
                } else {
                    image.addEventListener('load', activate, { once: true });
                }
            });

            let activeIndex = 0;
            let autoTimer = null;
            let startX = null;
            let startY = null;

            function updateSlide(index) {
                activeIndex = (index + finalDeck.length) % finalDeck.length;
                const slideWidth = track.querySelector('.featured-slide')?.getBoundingClientRect().width || track.clientWidth || 1;
                track.style.transform = `translateX(${activeIndex * slideWidth}px)`;
                dots.forEach((dot, dotIndex) => {
                    dot.classList.toggle('active', dotIndex === activeIndex);
                });
            }

            function restartAuto() {
                clearInterval(autoTimer);
                autoTimer = setInterval(() => updateSlide(activeIndex + 1), 5000);
            }

            navButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    updateSlide(button.dataset.dir === 'next' ? activeIndex + 1 : activeIndex - 1);
                    restartAuto();
                });
            });

            dots.forEach((dot) => {
                dot.addEventListener('click', () => {
                    updateSlide(Number(dot.dataset.index));
                    restartAuto();
                });
            });

            track.addEventListener('pointerdown', (event) => {
                startX = event.clientX;
                startY = event.clientY;
                clearInterval(autoTimer);
            });

            track.addEventListener('pointerup', (event) => {
                if (startX === null) return;
                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;
                if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    updateSlide(deltaX < 0 ? activeIndex + 1 : activeIndex - 1);
                }
                startX = null;
                startY = null;
                restartAuto();
            });

            track.addEventListener('pointercancel', () => {
                startX = null;
                startY = null;
                restartAuto();
            });

            updateSlide(0);
            restartAuto();
        }
        function getArticleVideoUrls(article) {
            return Array.isArray(article.videoUrls) && article.videoUrls.length
                ? article.videoUrls.filter(Boolean)
                : (article.videoUrl ? [article.videoUrl] : []);
        }

        function getYoutubeEmbedUrl(url) {
            const videoId = getYoutubeVideoId(url);
            return videoId ? `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?rel=0&playsinline=1` : '';
        }

        function isHlsUrl(url) {
            return /\.m3u8(?:$|[?#])/i.test(url || '')
                || /(?:format|type|protocol|stream)=?(?:hls|m3u8|application\/x-mpegurl)/i.test(url || '')
                || /(?:\/|\b)(?:hls|playlist|manifest|live\.m3u8)(?:\/|\b)/i.test(url || '');
        }

        function isDashUrl(url) {
            return /\.mpd(?:$|[?#])/i.test(url || '')
                || /(?:format|type|protocol|stream)=?(?:dash|mpd|application\/dash\+xml)/i.test(url || '');
        }

        function isFlvUrl(url) {
            return /\.(?:flv|ts)(?:$|[?#])/i.test(url || '')
                || /(?:format|type)=?(?:flv|mpegts|video\/mp2t)/i.test(url || '');
        }

        function loadExternalPlayer(src, globalName) {
            if (window[globalName]) return Promise.resolve(window[globalName]);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve(window[globalName]);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function loadMpegtsLibrary() {
            return loadExternalPlayer('https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js', 'mpegts');
        }

        function setupFeaturedStream(video, url) {
            if (!video) return;
            if (isHlsUrl(url)) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    return;
                }
                loadExternalPlayer('https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js', 'Hls')
                    .then((Hls) => {
                        if (!Hls || !Hls.isSupported()) throw new Error('HLS غير مدعوم');
                        const player = new Hls({ enableWorker: true, lowLatencyMode: true, startLevel: -1, capLevelToPlayerSize: true });
                        player.loadSource(url);
                        player.attachMedia(video);
                        player.startLoad(-1);
                    })
                    .catch(() => { video.poster = fallbackImage; });
            } else if (isDashUrl(url)) {
                loadExternalPlayer('https://cdn.dashjs.org/latest/dash.all.min.js', 'dashjs')
                    .then((dashjs) => {
                        if (!dashjs || !dashjs.MediaPlayer) throw new Error('DASH غير مدعوم');
                        dashjs.MediaPlayer().create().initialize(video, url, true);
                    })
                    .catch(() => { video.poster = fallbackImage; });
            } else if (isFlvUrl(url)) {
                loadMpegtsLibrary()
                    .then((mpegts) => {
                        if (!mpegts || !mpegts.isSupported()) throw new Error('FLV غير مدعوم');
                        const player = mpegts.createPlayer({ type: 'flv', url }, { enableWorker: true, lazyLoad: false, autoCleanupSourceBuffer: true });
                        player.attachMediaElement(video);
                        player.load();
                        player.play().catch(() => {});
                    })
                    .catch(() => { video.poster = fallbackImage; });
            } else {
                video.preload = 'auto';
                video.src = url;
                video.load();
                video.addEventListener('error', () => {
                    if (video.dataset.streamFallback) return;
                    video.dataset.streamFallback = 'true';
                    loadExternalPlayer('https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js', 'Hls')
                        .then((Hls) => {
                            if (!Hls || !Hls.isSupported()) throw new Error('البث غير مدعوم');
                            const player = new Hls();
                            player.loadSource(url);
                            player.attachMedia(video);
                        })
                        .catch(() => { video.poster = fallbackImage; });
                }, { once: true });
            }
        }

        function getFeaturedVideoHtml(article) {
            const videoUrl = getArticleVideoUrls(article)[0];
            if (!videoUrl) return '';
            const youtubeUrl = getYoutubeEmbedUrl(videoUrl);
            if (youtubeUrl) {
                return `<iframe class="featured-video" src="${youtubeUrl}&autoplay=1&mute=1" title="الفيديو المثبت" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="origin" allowfullscreen></iframe>`;
            }
            return `<video id="featured-video-player" class="featured-video" controls autoplay muted playsinline preload="auto"></video>`;
        }

        function getFeaturedVideoData() {
            if (!featuredVideo || featuredVideo.enabled !== true && featuredVideo.enabled !== 'true') return null;
            const url = String(featuredVideo.url || '').trim();
            if (!url) return null;
            return { title: 'الفيديو المثبت', videoUrl: url };
        }

        function getArticleHref(article) {
            const customUrl = String(article.url || article.link || '').trim();
            return customUrl || `article.html?id=${encodeURIComponent(article.id)}`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const selectedCategory = urlParams.get('category') || 'home';
        const searchTerm = urlParams.get('q') || '';
        const currentPage = Math.max(1, Number.parseInt(urlParams.get('page') || '1', 10) || 1);
        const articlesPerPage = 12;
        document.body.classList.add(selectedCategory === 'home' && !searchTerm ? 'home-page' : 'category-page');

        function enableTouchDraggingForCards() {
            const containers = document.querySelectorAll('.section-articles');
            containers.forEach((container) => {
                let isDown = false;
                let startX = 0;
                let startScrollLeft = 0;

                const stopDrag = () => {
                    isDown = false;
                    container.style.cursor = 'grab';
                };

                container.addEventListener('pointerdown', (event) => {
                    isDown = true;
                    startX = event.clientX;
                    startScrollLeft = container.scrollLeft;
                    container.style.cursor = 'grabbing';
                });

                container.addEventListener('pointermove', (event) => {
                    if (!isDown) return;
                    const delta = event.clientX - startX;
                    container.scrollLeft = startScrollLeft - delta;
                });

                container.addEventListener('pointerup', stopDrag);
                container.addEventListener('pointerleave', stopDrag);
                container.addEventListener('pointercancel', stopDrag);
            });
        }

        function buildCategoryTree(categories) {
            const entries = Object.entries(categories || {});
            const map = new Map(entries);
            const childMap = new Map();
            entries.forEach(([id, value]) => {
                const parentId = value?.parentId || null;
                if (!childMap.has(parentId)) childMap.set(parentId, []);
                if (parentId) childMap.get(parentId).push(id);
            });
            const makeItem = (id, seen = new Set()) => {
                if (seen.has(id) || !map.has(id)) return null;
                const value = map.get(id) || {};
                const item = {
                    id,
                    name: value.name || value.nam || value.title || value.label || 'قسم',
                    parentId: value.parentId || null,
                    url: value.url || '',
                    iconUrl: value.iconUrl || value.imageUrl || value.logoUrl || value.icon || value.image || value.categoryImage || '',
                    createdAt: Number(value.createdAt || 0),
                    children: []
                };
                const nextSeen = new Set(seen);
                nextSeen.add(id);
                const childIds = childMap.get(id) || [];
                childIds.forEach((childId) => {
                    const child = makeItem(childId, nextSeen);
                    if (child) item.children.push(child);
                });
                return item;
            };
            const roots = [];
            const rootIds = entries
                .filter(([id, value]) => !value?.parentId || !map.has(value.parentId))
                .map(([id]) => id);
            rootIds.forEach((id) => {
                const root = makeItem(id);
                if (root) roots.push(root);
            });
            return roots;
        }

        function getCategoryFilters(categoryId) {
            if (!categoryId || categoryId === 'home') return null;
            const ids = new Set([categoryId]);
            const queue = [categoryId];
            while (queue.length) {
                const currentId = queue.shift();
                const children = allCategories.filter((category) => category.parentId === currentId);
                children.forEach((child) => {
                    if (!ids.has(child.id)) {
                        ids.add(child.id);
                        queue.push(child.id);
                    }
                });
            }
            return ids;
        }

        function loadCategories() {
            return get(ref(db, 'categories'))
                .then((snapshot) => {
                    const categories = snapshot.exists() ? snapshot.val() : {};
                    allCategories = Object.entries(categories).map(([id, value], order) => ({
                        id,
                        name: value?.name || value?.nam || value?.title || value?.label || 'قسم',
                        sectionTitle: value?.sectionTitle || value?.columnTitle || value?.titleLabel || value?.name || '',
                        url: value?.url || '',
                        iconUrl: value?.iconUrl || value?.imageUrl || value?.logoUrl || value?.icon || value?.image || value?.categoryImage || '',
                        parentId: value?.parentId || null,
                        createdAt: Number(value?.createdAt || 0),
                        order,
                        children: []
                    }));
                    const bar = document.getElementById('categories-bar');
                    syncStickyBarHeight();
                    const roots = buildCategoryTree(categories);
                    const homeLink = '<a href="./index.html" class="category-link" data-id="home"><img src="./assets/home-icon.png" alt="الرئيسية" style="width:42px;height:42px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,0.04);display:block;"><span>الرئيسية</span></a>';
                    bar.innerHTML = homeLink;
                    const renderCategory = (category) => {
                        const categoryHref = category.url || `./index.html?category=${encodeURIComponent(category.id)}`;
                        const defaultIcon = 'https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfaham%20tube%201.png';
                        const iconUrl = category.iconUrl || category.imageUrl || category.logoUrl || defaultIcon;
                        const iconHtml = `<img src="${escapeHtml(iconUrl)}" alt="${escapeHtml(category.name)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${defaultIcon}';" style="width:42px;height:42px;object-fit:contain;border-radius:12px;flex-shrink:0;display:block;visibility:visible;opacity:1;background:rgba(255,255,255,0.04);">`;
                        return `<div class="category-item">
                            <a href="${categoryHref}" class="category-link" data-id="${category.id}">${iconHtml}<span>${escapeHtml(category.name)}</span></a>
                        </div>`;
                    };
                    bar.insertAdjacentHTML('beforeend', roots.map(renderCategory).join(''));
                })
                .catch(() => {
                    document.getElementById('categories-bar').innerHTML = '<a href="./index.html" class="category-link" data-id="home"><img src="./assets/home-icon.png" alt="الرئيسية" style="width:42px;height:42px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,0.04);display:block;"><span>الرئيسية</span></a>';
                    syncStickyBarHeight();
                });
        }

        function syncStickyBarHeight() {
            const categoriesBar = document.getElementById('categories-bar');
            if (categoriesBar) document.documentElement.style.setProperty('--categories-bar-height', `${categoriesBar.offsetHeight}px`);
        }

        document.addEventListener('click', (event) => {
            document.querySelectorAll('.category-item.open').forEach((item) => {
                if (item.contains(event.target)) return;
                item.classList.remove('open');
            });
        });

        function loadArticles() {
            Promise.all([get(ref(db, 'articles')), get(ref(db, 'featuredVideo'))])
                .then(([snapshot, featuredSnapshot]) => {
                    featuredVideo = featuredSnapshot.exists() ? featuredSnapshot.val() || null : null;
                    allArticles = normalizeArticles(snapshot);
                    renderLatestTicker(allArticles);
                    renderFeaturedReel(allArticles);
                    const filtered = allArticles.filter((article) => {
                        const searchableText = `${article.title || ''} ${article.content || ''}`.toLowerCase();
                        const matchesCategory = selectedCategory === 'home'
                            || article.categoryId === selectedCategory;
                        const matchesSearch = !searchTerm || searchableText.includes(searchTerm.toLowerCase());
                        return matchesCategory && matchesSearch;
                    }).sort((first, second) => {
                        if (selectedCategory === 'home' && isPinnedVideo(first) !== isPinnedVideo(second)) {
                            return isPinnedVideo(first) ? -1 : 1;
                        }
                        if (selectedCategory === 'home' && isPinned(first) !== isPinned(second)) {
                            return isPinned(first) ? -1 : 1;
                        }
                        return sortByNewest(first, second);
                    });
                    displayArticles(filtered);
                })
                .catch(() => {
                    renderLatestTicker([]);
                    displayArticles([]);
                });
        }

        const searchArea = document.getElementById('search-area');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.querySelector('.search-btn');
        if (searchButton && searchArea && searchInput) {
            searchButton.addEventListener('click', () => {
                searchArea.classList.toggle('open');
                if (searchArea.classList.contains('open')) searchInput.focus();
            });
            searchInput.value = searchTerm;
            searchArea.addEventListener('submit', (event) => {
                event.preventDefault();
                const query = searchInput.value.trim();
                const params = new URLSearchParams();
                if (selectedCategory !== 'home') params.set('category', selectedCategory);
                if (query) params.set('q', query);
                window.location.href = `./index.html${params.toString() ? '?' + params.toString() : ''}`;
            });
        }

        function renderHomepageCategorySections(articles) {
            const container = document.getElementById('home-category-sections');
            if (!container) return;
            if (selectedCategory !== 'home' || searchTerm) {
                container.innerHTML = '';
                return;
            }

            const roots = allCategories
                .filter((category) => !category.parentId || !allCategories.some((parent) => parent.id === category.parentId))
                .sort((first, second) => first.name.localeCompare(second.name, 'ar'));

            const sections = roots.map((category) => {
                const ids = getCategoryFilters(category.id) || new Set([category.id]);
                const sectionArticles = articles.filter((article) => ids.has(article.categoryId)).slice(0, 10);
                if (!sectionArticles.length) return '';

                const viewAllHref = category.url || `./index.html?category=${encodeURIComponent(category.id)}`;
                const sectionTitle = (category.sectionTitle || category.name || 'قسم').trim();
                const cards = sectionArticles.map((article) => {
                    const title = article.title || 'عنوان غير متاح';
                    const imageHtml = getArticleImageHtml(article, title);
                    const articleHref = getArticleHref(article);
                    return `
                        <a href="${articleHref}" class="article-card">
                            <div class="article-media">
                                ${imageHtml}
                                <div class="article-overlay">
                                    <h3>${escapeHtml(title)}</h3>
                                </div>
                            </div>
                        </a>`;
                }).join('');

                return `
                    <section class="home-category-section">
                        <div class="section-header">
                            <h3 class="section-title">${escapeHtml(sectionTitle)}</h3>
                            <a href="${viewAllHref}" class="section-view-all">عرض الكل</a>
                        </div>
                        <div class="section-articles">
                            ${cards}
                        </div>
                    </section>`;
            }).join('');

            container.innerHTML = sections;
            enableTouchDraggingForCards();
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articles-grid');
            const mainStory = document.getElementById('main-story');
            const subcategoryCards = document.getElementById('subcategory-cards');
            const pagination = document.getElementById('pagination');
            const homeSections = document.getElementById('home-category-sections');
            grid.innerHTML = '';
            subcategoryCards.innerHTML = '';
            subcategoryCards.classList.remove('visible');
            pagination.innerHTML = '';

            if (selectedCategory === 'home' && !searchTerm) {
                if (homeSections) homeSections.innerHTML = '';
                renderHomepageCategorySections(articles);
                mainStory.style.display = 'block';
                return;
            }

            if (selectedCategory !== 'home') {
                const childCategories = allCategories
                    .filter((category) => category.parentId === selectedCategory)
                    .sort((first, second) => {
                        if (first.createdAt && second.createdAt && first.createdAt !== second.createdAt) {
                            return first.createdAt - second.createdAt;
                        }
                        return first.order - second.order;
                    });
                if (childCategories.length) {
                    subcategoryCards.innerHTML = childCategories.map((category) => {
                        const targetHref = category.url || `./index.html?category=${encodeURIComponent(category.id)}`;
                        const defaultIcon = 'https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfaham%20tube%201.png';
                        const iconUrl = category.iconUrl || category.imageUrl || category.logoUrl || defaultIcon;
                        return `
                            <a class="subcategory-card" href="${targetHref}">
                                <img src="${escapeHtml(iconUrl)}" alt="${escapeHtml(category.name)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${defaultIcon}';">
                                <span>${escapeHtml(category.name)}</span>
                            </a>`;
                    }).join('');
                    subcategoryCards.classList.add('visible');
                }
            }

            if (!articles || articles.length === 0) {
                mainStory.style.display = 'none';
                mainStory.innerHTML = '';
                grid.innerHTML = `<p class="empty-state">${selectedCategory === 'home' ? 'لا توجد فيديوهات منشورة حاليًا.' : 'لا توجد فيديوهات في هذا القسم حاليًا.'}</p>`;
                return;
            }

            const isHomepage = selectedCategory === 'home' && !searchTerm;
            const hasSeparateFeaturedVideo = isHomepage && Boolean(getFeaturedVideoData());
            const homepageFeaturedArticleCount = isHomepage && !hasSeparateFeaturedVideo ? 1 : 0;
            const homepageFirstPageSize = articlesPerPage + homepageFeaturedArticleCount;
            const totalPages = isHomepage
                ? (articles.length <= homepageFirstPageSize
                    ? 1
                    : 1 + Math.ceil((articles.length - homepageFirstPageSize) / articlesPerPage))
                : Math.ceil(articles.length / articlesPerPage);
            const page = Math.min(currentPage, totalPages);
            const pageStart = isHomepage && page > 1
                ? homepageFirstPageSize + ((page - 2) * articlesPerPage)
                : (isHomepage ? 0 : (page - 1) * articlesPerPage);
            const pageSize = isHomepage && page === 1 ? homepageFirstPageSize : articlesPerPage;
            const pageArticles = articles.slice(pageStart, pageStart + pageSize);
            const showMainStory = isHomepage && page === 1;
            const cards = showMainStory
                ? (hasSeparateFeaturedVideo ? pageArticles : pageArticles.slice(1))
                : pageArticles;

            if (showMainStory) {
                const first = pageArticles[0];
                const separateFeaturedVideo = getFeaturedVideoData();
                const featuredArticle = separateFeaturedVideo ? { videoUrl: separateFeaturedVideo.videoUrl } : first;
                const mainTitle = separateFeaturedVideo ? separateFeaturedVideo.title : (first.title || 'عنوان غير متاح');
                const mainImageHtml = getArticleImageHtml(first, mainTitle);
                const featuredVideoHtml = separateFeaturedVideo
                    ? getFeaturedVideoHtml(featuredArticle)
                    : (isPinnedVideo(first) ? getFeaturedVideoHtml(first) : '');
                const mainLink = separateFeaturedVideo ? '' : getArticleHref(first);

                mainStory.style.display = 'block';
                mainStory.innerHTML = `
                    ${featuredVideoHtml || `<a href="${mainLink}" style="text-decoration: none; color: inherit;">${mainImageHtml}</a>`}
                    ${mainLink ? `<a href="${mainLink}" style="text-decoration: none; color: inherit;"><h2>${mainTitle}</h2></a>` : ''}`;
                const featuredUrl = getArticleVideoUrls(featuredArticle)[0];
                if (featuredVideoHtml && !getYoutubeEmbedUrl(featuredUrl)) {
                    setupFeaturedStream(document.getElementById('featured-video-player'), featuredUrl);
                }
            } else {
                mainStory.style.display = 'none';
                mainStory.innerHTML = '';
            }

            cards.forEach((article) => {
                const title = article.title || 'عنوان غير متاح';
                const imageHtml = getArticleImageHtml(article, title);
                const articleHref = getArticleHref(article);

                grid.innerHTML += `
                    <a href="${articleHref}" class="article-card">
                        <div class="article-media">
                            ${imageHtml}
                            <div class="article-overlay">
                                <h3>${escapeHtml(title)}</h3>
                            </div>
                        </div>
                    </a>`;
            });

            if (totalPages > 1) {
                for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
                    const params = new URLSearchParams();
                    if (selectedCategory !== 'home') params.set('category', selectedCategory);
                    if (searchTerm) params.set('q', searchTerm);
                    if (pageNumber > 1) params.set('page', pageNumber);
                    const activeClass = pageNumber === page ? ' active' : '';
                    pagination.innerHTML += `<a href="./index.html?${params.toString()}" class="${activeClass.trim()}" aria-label="الصفحة ${pageNumber}">${pageNumber}</a>`;
                }
            }
        }

        loadCategories().then(loadArticles);
        if ('ResizeObserver' in window) new ResizeObserver(syncStickyBarHeight).observe(document.getElementById('categories-bar'));
        window.addEventListener('resize', syncStickyBarHeight);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=5', { updateViaCache: 'none' }).then((registration) => registration.update()).catch(() => {});
        }
        setupInstallPrompt();
    </script>
</body>

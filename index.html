<script>
// متغيرات الحالة
let allSections = {};
let allMovies = {};
let allSeries = {};
let currentPath = { page: 'home', section: null, item: null };
let isNavigatingHistory = false;

// وظائف الملاحة المتقدمة
function navigateTo(page, sectionKey = null, itemKey = null, pushState = true) {
  const previousPath = { ...currentPath };

  if (page === 'playerPage') {
    const movie = itemKey ? allMovies[itemKey] : null;
    if (!movie) {
      if (sectionKey) {
        page = 'contentPage';
        itemKey = null;
      } else {
        page = 'home';
        sectionKey = null;
        itemKey = null;
      }
    }
  }

  currentPath.page = page;
  currentPath.section = sectionKey;
  currentPath.item = itemKey;

  // التحكم في ظهور الهيدر (يظهر فقط في الصفحة الرئيسية)
  const header = document.querySelector('.header-bar');
  if (header) {
    header.style.display = (page === 'home') ? 'flex' : 'none';
  }
  
  // تعديل تباعد الجسم بناءً على وجود الهيدر
  if (page === 'home') {
    document.body.classList.add('body-with-header');
  } else {
    document.body.classList.remove('body-with-header');
  }

  // إخفاء جميع الصفحات
  const pages = ['home', 'contentPage', 'episodes', 'playerPage', 'externalPage'];
  pages.forEach(p => {
    const el = document.getElementById(p);
    if (el) el.style.display = 'none';
  });

  // إغلاق مشغل الأفلام نهائيًا عند الخروج
  const youtubeFrame = document.getElementById('youtubeFrame');
  const playerPageEl = document.getElementById('playerPage');
  if (page !== 'playerPage') {
    if (playerPageEl) {
      playerPageEl.style.display = 'none';
    }
    if (youtubeFrame) {
      youtubeFrame.src = '';
      youtubeFrame.removeAttribute('src');
      youtubeFrame.style.display = 'none';
    }
  } else {
    if (youtubeFrame) {
      youtubeFrame.style.display = 'block';
    }
    if (playerPageEl) {
      playerPageEl.style.display = 'block';
    }
  }

  if (page !== 'externalPage') {
    const externalPage = document.getElementById('externalPage');
    if (externalPage) {
      externalPage.style.display = 'none';
      const externalFrame = document.getElementById('externalFrame');
      if (externalFrame) {
        externalFrame.src = '';
      }
    }
  }

  if (page === 'externalPage') {
    const externalPage = document.getElementById('externalPage');
    if (externalPage) externalPage.style.display = 'block';
    const externalFrame = document.getElementById('externalFrame');
    if (externalFrame) {
      if (sectionKey === 'live') {
        externalFrame.src = 'https://alfahamtv.github.io/live/';
      } else if (sectionKey === 'drama') {
        externalFrame.src = 'https://alfahamtv.github.io/drama';
      }
    }
  }

  // إظهار الصفحة المطلوبة
  const target = document.getElementById(page);
  if (target) {
    target.style.display = (page === 'episodes') ? 'flex' : 'block';
  }

  // تعديل موضع مشغل المسلسلات إلى أعلى الشاشة دائماً
  const episodesPage = document.getElementById('episodes');
  if (episodesPage) {
    episodesPage.style.top = '0';
  }

  // إيقاف المشغلات وتفريغها عند مغادرتها
  if (page !== 'playerPage') {
    const movieFrame = document.getElementById('youtubeFrame');
    if (movieFrame) {
      movieFrame.src = '';
      movieFrame.removeAttribute('src');
    }
  }
  if (page !== 'episodes') {
    const seriesFrame = document.getElementById('seriesVideoPlayer');
    if (seriesFrame) {
      seriesFrame.src = '';
      seriesFrame.removeAttribute('src');
    }
  }

  // تحديث المحتوى بناءً على الصفحة
  if (page === 'home') {
    renderSections();
  } else if (page === 'contentPage') {
    if (sectionKey) {
      renderContent(sectionKey);
    } else {
      renderSections();
    }
  } else if (page === 'episodes' && itemKey) {
    const series = allSeries[itemKey];
    if (series) renderEpisodes(series);
  } else if (page === 'playerPage' && itemKey) {
    const movie = allMovies[itemKey];
    if (movie) renderMoviePlayer(movie.url);
  } else if (page === 'externalPage') {
    if (sectionKey === 'live' || sectionKey === 'drama') {
      // externalFrame src is handled by showExternalPage or hash navigation
    }
  }

  // إدارة تاريخ المتصفح والروابط
  let hash = `#${page}`;
  if (page === 'playerPage') {
    if (itemKey) {
      hash += `/${itemKey}`;
    }
  } else {
    if (sectionKey) hash += `/${sectionKey}`;
    if (itemKey) hash += `/${itemKey}`;
  }

  if (pushState) {
    const isEpisodeReplace = page === 'episodes' && previousPath.page === 'episodes';
    if (isEpisodeReplace) {
      history.replaceState({ page, section: sectionKey, item: itemKey }, '', hash);
    } else {
      history.pushState({ page, section: sectionKey, item: itemKey }, '', hash);
    }
  } else {
    history.replaceState({ page, section: sectionKey, item: itemKey }, '', hash);
  }

  if (typeof syncBottomNavActive === 'function') {
    syncBottomNavActive();
  }
}

// التعامل مع تغيير الهاتش (زر الرجوع وتحديث الصفحة)
window.onhashchange = null;

window.addEventListener('popstate', function(event) {
  isNavigatingHistory = true;

  if (event.state) {
    if (event.state.page === 'episodes') {
      navigateTo('contentPage', event.state.section, null, false);
    } else if (event.state.page === 'contentPage') {
      if (!event.state.section || !allSections[event.state.section]) {
        navigateTo('home', null, null, false);
      } else {
        navigateTo('contentPage', event.state.section, null, false);
      }
    } else if (event.state.page === 'playerPage') {
      if (event.state.item) {
        navigateTo('playerPage', null, event.state.item, false);
      } else {
        navigateTo('home', null, null, false);
      }
    } else {
      navigateTo(event.state.page, event.state.section, event.state.item, false);
    }
  } else {
    parseHashAndNavigate();
  }

  setTimeout(() => {
    isNavigatingHistory = false;
  }, 0);
});

function parseHashAndNavigate() {
  const hash = location.hash.replace('#', '');
  if (!hash) {
    navigateTo('home', null, null, false);
    return;
  }

  const parts = hash.split('/');
  let page = parts[0];
  let sectionKey = parts[1] || null;
  let itemKey = parts[2] || null;

  if (page === 'playerPage' && !itemKey) {
    itemKey = sectionKey;
    sectionKey = null;
  }

  if (page === 'playerPage' && !itemKey) {
    page = 'home';
  }

  if (page === 'contentPage') {
    if (!sectionKey || !allSections[sectionKey]) {
      page = 'home';
      sectionKey = null;
    }
  }

  if (page === 'externalPage') {
    if (sectionKey !== 'live' && sectionKey !== 'drama') {
      page = 'home';
      sectionKey = null;
    }
  }

  navigateTo(page, sectionKey, itemKey, false);
}

function hideExternalPage() {
  const externalPage = document.getElementById('externalPage');
  const externalFrame = document.getElementById('externalFrame');
  if (externalPage) externalPage.style.display = 'none';
  if (externalFrame) externalFrame.src = '';
}

function showHome() {
  hideExternalPage();
  navigateTo('home');
}

function syncBottomNavActive() {
  const homeButton = document.getElementById('bottomHomeButton');
  const liveButton = document.getElementById('bottomLiveButton');
  const dramaButton = document.getElementById('bottomDramaButton');
  [homeButton, liveButton, dramaButton].forEach(button => {
    if (button) button.classList.remove('active');
  });

  if (currentPath.page === 'externalPage') {
    if (currentPath.section === 'live' && liveButton) {
      liveButton.classList.add('active');
    }
    if (currentPath.section === 'drama' && dramaButton) {
      dramaButton.classList.add('active');
    }
  } else if (currentPath.page === 'home' && homeButton) {
    homeButton.classList.add('active');
  }
}

function renderContent(sectionKey) {
  const grid = document.getElementById('contentGrid');
  grid.innerHTML = '';
  
  const sectionName = allSections[sectionKey] ? allSections[sectionKey].name : 'المحتوى';
  document.getElementById('contentTitle').textContent = sectionName;

  // تصفية الأفلام
  Object.keys(allMovies).forEach(movieKey => {
    const movie = allMovies[movieKey];
    if (movie.category === sectionKey) {
      const img = movie.image || getVideoThumbnail(movie.url, 'https://via.placeholder.com/300x169?text=Movie');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${img}"><div class="card-title">${movie.title}</div>`;
      card.onclick = () => navigateTo('playerPage', sectionKey, movieKey);
      grid.appendChild(card);
    }
  });

  // تصفية المسلسلات
  Object.keys(allSeries).forEach(seriesKey => {
    const series = allSeries[seriesKey];
    if (series.category === sectionKey) {
      const episodes = series.episodes ? (Array.isArray(series.episodes) ? series.episodes : Object.values(series.episodes)) : [];
      let seriesImg = series.image || '';
      if (!seriesImg && episodes.length > 0 && episodes[0]) {
        const firstEpisodeId = getYouTubeId(episodes[0]);
        if (firstEpisodeId) {
          seriesImg = `https://img.youtube.com/vi/${firstEpisodeId}/hqdefault.jpg`;
        }
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${seriesImg || 'https://via.placeholder.com/300x169?text=Series'}"><div class="card-title">${series.title}</div>`;
      card.onclick = () => navigateTo('episodes', sectionKey, seriesKey);
      grid.appendChild(card);
    }
  });
}

function renderEpisodes(series) {
  if (!series) return;
  
  document.getElementById('episodeTitle').innerHTML = `${series.title}`;
  const videoPlayer = document.getElementById('seriesVideoPlayer');
  const episodeList = document.getElementById('seriesEpisodeList');
  episodeList.innerHTML = '';

  const episodes = series.episodes ? (Array.isArray(series.episodes) ? series.episodes : Object.values(series.episodes)) : [];

  episodes.forEach((url, index) => {
    const id = getYouTubeId(url);
    if (!id) return;

    const card = document.createElement('div');
    card.className = 'series-channel-card';
    const embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`;

    const name = document.createElement('div');
    name.className = 'series-episode-name';
    name.textContent = `الحلـقة رقـم ${index + 1}`;

    card.appendChild(name);
    card.onclick = () => {
      videoPlayer.src = embedUrl;
    };
    episodeList.appendChild(card);
  });

  // تشغيل الحلقة الأولى تلقائياً إذا كان المشغل فارغاً
  if (episodes.length > 0) {
    const currentSrc = videoPlayer.getAttribute('src') || '';
    if (!currentSrc || !currentSrc.includes('youtube.com')) {
      const firstId = getYouTubeId(episodes[0]);
      videoPlayer.src = `https://www.youtube.com/embed/${firstId}?rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`;
    }
  }
}

function renderMoviePlayer(url) {
  const ytId = getYouTubeId(url);
  const youtubeFrame = document.getElementById('youtubeFrame');

  if (ytId && youtubeFrame) {
    youtubeFrame.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`;
  }
}

function getYouTubeId(url) {
  let id = '';
  if (!url) return '';
  
  if (url.includes('youtu.be/')) {
    id = url.split('youtu.be/')[1];
  } else if (url.includes('watch?v=')) {
    id = url.split('v=')[1];
  } else if (url.includes('live/')) {
    id = url.split('live/')[1];
  } else if (url.includes('embed/')) {
    id = url.split('embed/')[1];
  } else {
    id = url;
  }
  
  if (id.includes('?')) id = id.split('?')[0];
  if (id.includes('&')) id = id.split('&')[0];
  return id.trim();
}

function getVideoThumbnail(url, fallback = 'https://via.placeholder.com/300x169?text=Video') {
  const ytId = getYouTubeId(url);
  return ytId ? `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg` : fallback;
}

// جلب البيانات من Firebase
function loadData() {
  database.ref('sections').on('value', snapshot => {
    allSections = snapshot.val() || {};
    if (currentPath.page === 'home') renderSections();
    if (currentPath.page === 'contentPage') renderContent(currentPath.section);
  });
  
  database.ref('movies').on('value', snapshot => {
    allMovies = snapshot.val() || {};
    if (currentPath.page === 'contentPage') renderContent(currentPath.section);
    if (currentPath.page === 'playerPage') renderMoviePlayer(allMovies[currentPath.item]?.url);
  });
  
  database.ref('series').on('value', snapshot => {
    allSeries = snapshot.val() || {};
    if (currentPath.page === 'contentPage') renderContent(currentPath.section);
    if (currentPath.page === 'episodes') renderEpisodes(allSeries[currentPath.item]);
  });
}

function renderSections() {
  const grid = document.getElementById('sectionsGrid');
  grid.innerHTML = '';
  
  Object.keys(allSections).forEach(key => {
    const section = allSections[key];
    const card = document.createElement('div');
    card.className = 'card';
    const img = section.image || `https://via.placeholder.com/300x169?text=${section.name}`;
    card.innerHTML = `
      <img src="${img}" alt="${section.name}">
      <div class="card-title">${section.name}</div>
    `;
    card.onclick = () => navigateTo('contentPage', key);
    grid.appendChild(card);
  });
}

// وظيفة البحث
function toggleSearch() {
  const container = document.getElementById('searchContainer');
  const toggleBtn = document.getElementById('searchToggleButton');
  const searchInput = document.getElementById('searchInput');
  const suggestions = document.getElementById('searchSuggestions');

  if (container.style.display === 'none' || !container.style.display) {
    container.style.display = 'flex';
    toggleBtn.style.display = 'none';
    searchInput.focus();
  } else {
    container.style.display = 'none';
    toggleBtn.style.display = 'flex';
    searchInput.value = '';
    suggestions.classList.remove('active');
    showHome();
  }
}

function displaySuggestions(suggestions) {
  const container = document.getElementById('searchSuggestions');
  
  if (suggestions.length === 0) {
    container.classList.remove('active');
    return;
  }
  
  container.innerHTML = '';
  suggestions.forEach(item => {
    const div = document.createElement('div');
    div.className = 'search-suggestion-item';
    
    const img = document.createElement('img');
    img.src = item.image;
    img.onerror = () => img.style.display = 'none';
    
    const info = document.createElement('div');
    info.className = 'search-suggestion-item-info';
    
    const title = document.createElement('div');
    title.className = 'search-suggestion-item-title';
    title.textContent = item.title;
    
    const type = document.createElement('div');
    type.className = 'search-suggestion-item-type';
    type.textContent = item.type === 'movie' ? '🎬 فيلم' : '📺 مسلسل';
    
    info.appendChild(title);
    info.appendChild(type);
    
    div.appendChild(img);
    div.appendChild(info);
    
    div.onclick = () => {
      container.classList.remove('active');
      document.getElementById('searchInput').value = '';
      if (item.type === 'movie') {
        navigateTo('playerPage', null, item.key);
      } else {
        navigateTo('episodes', null, item.key);
      }
    };
    
    container.appendChild(div);
  });
  
  container.classList.add('active');
}

document.getElementById('searchInput').addEventListener('input', function() {
  const query = this.value.toLowerCase().trim();
  
  if (!query) {
    document.getElementById('searchSuggestions').classList.remove('active');
    showHome();
    return;
  }
  
  const suggestions = [];

  // البحث في الأفلام
  Object.keys(allMovies).forEach(key => {
    const movie = allMovies[key];
    if (movie.title.toLowerCase().includes(query)) {
      const image = movie.image || getVideoThumbnail(movie.url, 'https://via.placeholder.com/50x28?text=Movie');
      suggestions.push({
        key: key,
        title: movie.title,
        image: image,
        type: 'movie'
      });
    }
  });
  
  // البحث في المسلسلات
  Object.keys(allSeries).forEach(key => {
    const series = allSeries[key];
    if (series.title.toLowerCase().includes(query)) {
      const episodes = series.episodes ? (Array.isArray(series.episodes) ? series.episodes : Object.values(series.episodes)) : [];
      let image = series.image;
      if (episodes.length > 0 && episodes[0]) {
        const firstEpisodeId = getYouTubeId(episodes[0]);
        if (firstEpisodeId) {
          image = `https://img.youtube.com/vi/${firstEpisodeId}/hqdefault.jpg`;
        }
      }
      suggestions.push({
        key: key,
        title: series.title,
        image: image,
        type: 'series'
      });
    }
  });

  displaySuggestions(suggestions.slice(0, 8)); // عرض أول 8 نتائج
});

// إغلاق المقترحات عند النقر خارجها
document.addEventListener('click', function(e) {
  const searchContainer = document.getElementById('searchContainer');
  const searchInput = document.getElementById('searchInput');
  const suggestions = document.getElementById('searchSuggestions');
  
  if (!searchContainer.contains(e.target) && searchContainer.style.display === 'flex') {
    suggestions.classList.remove('active');
  }
});

function setupBottomNav() {
  const homeButton = document.getElementById('bottomHomeButton');
  const liveButton = document.getElementById('bottomLiveButton');
  const dramaButton = document.getElementById('bottomDramaButton');

  function setActiveBottomButton(activeButton) {
    [homeButton, liveButton, dramaButton].forEach(button => {
      button.classList.toggle('active', button === activeButton);
    });
  }

  homeButton.addEventListener('click', () => {
    hideExternalPage();
    showHome();
    setActiveBottomButton(homeButton);
    const searchContainer = document.getElementById('searchContainer');
    if (searchContainer) {
      searchContainer.style.display = 'none';
      document.getElementById('searchToggleButton').style.display = 'flex';
      document.getElementById('searchInput').value = '';
      document.getElementById('searchSuggestions').classList.remove('active');
    }
  });

  function showExternalPage(url, sectionName) {
    const externalFrame = document.getElementById('externalFrame');
    if (externalFrame) externalFrame.src = url;
    navigateTo('externalPage', sectionName, null);
    const header = document.querySelector('.header-bar');
    if (header) header.style.display = 'none';
  }

  liveButton.addEventListener('click', () => {
    setActiveBottomButton(liveButton);
    showExternalPage('https://alfahamtv.github.io/live/', 'live');
  });

  dramaButton.addEventListener('click', () => {
    setActiveBottomButton(dramaButton);
    showExternalPage('https://alfahamtv.github.io/drama', 'drama');
  });
}

// تحميل البيانات عند البدء
window.addEventListener('load', () => {
  loadData();
  setupBottomNav();
  // قراءة الرابط الحالي عند التحميل
  parseHashAndNavigate();
  history.replaceState(currentPath, '', location.hash || '#home');
});
</script>

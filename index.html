        function normalizeArticles(snapshot) {
            if (!snapshot || !snapshot.exists()) return [];
            const data = snapshot.val() || {};
            return Object.entries(data)
                .map(([id, value]) => ({ id, ...(value || {}) }))
                .sort(sortByNewest);
        }

        function sortByNewest(first, second) {
            return Number(second.createdAt || 0) - Number(first.createdAt || 0);
        }

            return article.pinned === true || article.pinned === 'true' || article.pinned === 1;

        function getYoutubeVideoId(url) {
            if (!url) return '';
            try {
                const parsedUrl = new URL(String(url).trim());
                const hostname = parsedUrl.hostname.toLowerCase();
                if (hostname === 'youtu.be') return parsedUrl.pathname.slice(1).split('/')[0];
                if (!hostname.includes('youtube.com')) return '';
                if (parsedUrl.pathname === '/watch') return parsedUrl.searchParams.get('v') || '';

                if (['shorts', 'live', 'embed'].includes(pathParts[0])) return pathParts[1] || '';
            } catch (error) {
                return '';
            }
            return '';

            return fallbackImage;
        }

        function getArticleImageHtml(article, title) {
            const image = getArticleImage(article);
            return `<img src="${image}" alt="${title}" onerror="this.onerror=null;this.src='${fallbackImage}';">`;
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        }

        function getArticlePreview(content, maxLength = 110) {
            const previewElement = document.createElement('div');
            previewElement.innerHTML = String(content || '');
            const text = (previewElement.textContent || previewElement.innerText || '')
                .replace(/\s+/g, ' ')
                .trim();
            return text.length > maxLength ? `${text.slice(0, maxLength).trim()}...` : text;
        }

        function renderLatestTicker(articles) {
            const latest = articles.slice(0, 10);
            const links = latest.length
                ? latest.map((article) => `<a class="latest-ticker-link" href="${escapeHtml(getArticleHref(article))}">${escapeHtml(article.title || 'موضوع جديد')}</a>`).join('')
                : '<span class="latest-ticker-link">لا توجد مواضيع منشورة حاليًا</span>';
            document.querySelectorAll('.latest-ticker').forEach((ticker) => {
                const track = ticker.querySelector('.latest-ticker-track');
                if (!track) return;
                track.innerHTML = links + links;
                ticker.hidden = false;
            });
        }

        function getArticleVideoUrls(article) {
            return Array.isArray(article.videoUrls) && article.videoUrls.length
                ? article.videoUrls.filter(Boolean)
                : (article.videoUrl ? [article.videoUrl] : []);
        }

        function getYoutubeEmbedUrl(url) {
            const videoId = getYoutubeVideoId(url);
            return videoId ? `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?rel=0&playsinline=1` : '';
        }

        function isHlsUrl(url) {
            return /\.m3u8(?:$|[?#])/i.test(url || '')
                || /(?:format|type|protocol|stream)=?(?:hls|m3u8|application\/x-mpegurl)/i.test(url || '')
                || /(?:\/|\b)(?:hls|playlist|manifest|live\.m3u8)(?:\/|\b)/i.test(url || '');
        }

        function isDashUrl(url) {
            return /\.mpd(?:$|[?#])/i.test(url || '')
                || /(?:format|type|protocol|stream)=?(?:dash|mpd|application\/dash\+xml)/i.test(url || '');
        }

        function isFlvUrl(url) {
            return /\.(?:flv|ts)(?:$|[?#])/i.test(url || '')
                || /(?:format|type)=?(?:flv|mpegts|video\/mp2t)/i.test(url || '');
        }

        function loadExternalPlayer(src, globalName) {
            if (window[globalName]) return Promise.resolve(window[globalName]);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve(window[globalName]);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function loadMpegtsLibrary() {
            return loadExternalPlayer('https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js', 'mpegts');
        }

        function setupFeaturedStream(video, url) {
            if (!video) return;
            if (isHlsUrl(url)) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    return;
                }
                loadExternalPlayer('https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js', 'Hls')
                    .then((Hls) => {
                        if (!Hls || !Hls.isSupported()) throw new Error('HLS غير مدعوم');
                        const player = new Hls();
                        player.loadSource(url);
                        player.attachMedia(video);
                    })
                    .catch(() => { video.poster = fallbackImage; });
            } else if (isDashUrl(url)) {
                loadExternalPlayer('https://cdn.dashjs.org/latest/dash.all.min.js', 'dashjs')
                    .then((dashjs) => {
                        if (!dashjs || !dashjs.MediaPlayer) throw new Error('DASH غير مدعوم');
                        dashjs.MediaPlayer().create().initialize(video, url, false);
                    })
                    .catch(() => { video.poster = fallbackImage; });
            } else if (isFlvUrl(url)) {
                loadMpegtsLibrary()
                    .then((mpegts) => {
                        if (!mpegts || !mpegts.isSupported()) throw new Error('FLV غير مدعوم');
                        const player = mpegts.createPlayer({ type: 'flv', url });
                        player.attachMediaElement(video);
                        player.load();
                        player.play().catch(() => {});
                    })
                    .catch(() => { video.poster = fallbackImage; });
            } else {
                video.src = url;
                video.addEventListener('error', () => {
                    if (video.dataset.streamFallback) return;
                    video.dataset.streamFallback = 'true';
                    loadExternalPlayer('https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js', 'Hls')
                        .then((Hls) => {
                            if (!Hls || !Hls.isSupported()) throw new Error('البث غير مدعوم');
                            const player = new Hls();
                            player.loadSource(url);
                            player.attachMedia(video);
                        })
                        .catch(() => { video.poster = fallbackImage; });
                }, { once: true });
            }
        }

        function getFeaturedVideoHtml(article) {
            const videoUrl = getArticleVideoUrls(article)[0];
            if (!videoUrl) return '';
            const youtubeUrl = getYoutubeEmbedUrl(videoUrl);
            if (youtubeUrl) {
                return `<iframe class="featured-video" src="${youtubeUrl}&autoplay=1&mute=1" title="الفيديو المثبت" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="origin" allowfullscreen></iframe>`;
            }
            return `<video id="featured-video-player" class="featured-video" controls autoplay muted playsinline></video>`;
        }

        function getFeaturedVideoData() {
            if (!featuredVideo || featuredVideo.enabled !== true && featuredVideo.enabled !== 'true') return null;
            const url = String(featuredVideo.url || '').trim();
            if (!url) return null;
            return { title: 'الفيديو المثبت', videoUrl: url };
        }

        function getArticleHref(article) {
            const customUrl = String(article.url || article.link || '').trim();
            return customUrl || `article.html?id=${encodeURIComponent(article.id)}`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const selectedCategory = urlParams.get('category') || 'home';
        const searchTerm = urlParams.get('q') || '';
        const currentPage = Math.max(1, Number.parseInt(urlParams.get('page') || '1', 10) || 1);
        const articlesPerPage = 12;
        document.body.classList.add(selectedCategory === 'home' && !searchTerm ? 'home-page' : 'category-page');

        function buildCategoryTree(categories) {
            const entries = Object.entries(categories || {});
            const map = new Map(entries);
            const childMap = new Map();
            entries.forEach(([id, value]) => {
                const parentId = value?.parentId || null;
                if (!childMap.has(parentId)) childMap.set(parentId, []);
                if (parentId) childMap.get(parentId).push(id);
            });
            const makeItem = (id, seen = new Set()) => {
                if (seen.has(id) || !map.has(id)) return null;
                const value = map.get(id) || {};
                const item = {
                    id,
                    name: value.name || value.nam || value.title || value.label || 'قسم',
                    parentId: value.parentId || null,
                    url: value.url || '',
                    iconUrl: value.iconUrl || value.imageUrl || value.logoUrl || '',
                    children: []
                };
                const nextSeen = new Set(seen);
                nextSeen.add(id);
                const childIds = childMap.get(id) || [];
                childIds.forEach((childId) => {
                    const child = makeItem(childId, nextSeen);
                    if (child) item.children.push(child);
                });
                return item;
            };
            const roots = [];
            const rootIds = entries
                .filter(([id, value]) => !value?.parentId || !map.has(value.parentId))
                .map(([id]) => id);
            rootIds.forEach((id) => {
                const root = makeItem(id);
                if (root) roots.push(root);
            });
            return roots;
        }

        function getCategoryFilters(categoryId) {
            if (!categoryId || categoryId === 'home') return null;
            const ids = new Set([categoryId]);
            const queue = [categoryId];
            while (queue.length) {
                const currentId = queue.shift();
                const children = allCategories.filter((category) => category.parentId === currentId);
                children.forEach((child) => {
                    if (!ids.has(child.id)) {
                        ids.add(child.id);
                        queue.push(child.id);
                    }
                });
            }
            return ids;
        }

        function loadCategories() {
            return get(ref(db, 'categories'))
                .then((snapshot) => {
                    const categories = snapshot.exists() ? snapshot.val() : {};
                    allCategories = Object.entries(categories).map(([id, value]) => ({
                        id,
                        name: value?.name || value?.nam || value?.title || value?.label || 'قسم',
                        url: value?.url || '',
                        iconUrl: value?.iconUrl || value?.imageUrl || value?.logoUrl || '',
                        parentId: value?.parentId || null,
                        children: []
                    }));
                    const bar = document.getElementById('categories-bar');
                    syncStickyBarHeight();
                    const roots = buildCategoryTree(categories);
                    const homeLink = '<a href="./" class="category-link" data-id="home"><img src="https://c.top4top.io/p_3909b9cn40.png" alt="الرئيسية" style="width:42px;height:42px;object-fit:cover;border-radius:12px;background:transparent;"><span>الرئيسية</span></a>';
                    bar.innerHTML = homeLink;
                    const renderCategory = (category) => {
                        const children = category.children || [];
                        const categoryHref = category.url || `./?category=${encodeURIComponent(category.id)}`;
                        const iconUrl = category.iconUrl || category.imageUrl || '';
                        const iconHtml = iconUrl
                            ? `<img src="${escapeHtml(iconUrl)}" alt="${escapeHtml(category.name)}" loading="lazy" onerror="this.style.display='none';" style="width:42px;height:42px;object-fit:cover;border-radius:12px;flex-shrink:0;">`
                            : `<img src="https://f.top4top.io/p_3909f09fm1.png" alt="${escapeHtml(category.name)}" loading="lazy" onerror="this.style.display='none';" style="width:42px;height:42px;object-fit:cover;border-radius:12px;flex-shrink:0;">`;
                        const submenu = children.length
                            ? `<div class="sub-menu">${children.map(renderCategory).join('')}</div>`
                            : '';
                        return `<div class="category-item${children.length ? ' has-children' : ''}">
                            <a href="${categoryHref}" class="category-link${children.length ? ' category-parent-link' : ''}" data-id="${category.id}">${iconHtml}<span>${escapeHtml(category.name)}</span></a>
                            ${children.length ? `<button type="button" class="category-toggle" title="فتح الأقسام الفرعية" aria-label="فتح الأقسام الفرعية لقسم ${escapeHtml(category.name)}" aria-expanded="false">⌄</button>` : ''}
                            ${submenu}
                        </div>`;
                    };
                    bar.insertAdjacentHTML('beforeend', roots.map(renderCategory).join(''));
                    const toggleCategoryItem = (item) => {
                        const submenu = item.querySelector(':scope > .sub-menu');
                        const toggle = item.querySelector(':scope > .category-toggle');
                        if (!submenu) return;
                        if (window.innerWidth <= 768) {
                            const barBottom = bar.getBoundingClientRect().bottom;
                            document.documentElement.style.setProperty('--category-menu-top', `${Math.max(4, barBottom + 4)}px`);
                        }
                        const isOpen = item.classList.toggle('open');
                        if (toggle) toggle.setAttribute('aria-expanded', String(isOpen));
                    };

                    const toggleButtons = bar.querySelectorAll('.category-item > .category-toggle');
                    toggleButtons.forEach((toggle) => {
                        toggle.addEventListener('click', (event) => {
                            event.preventDefault();
                            event.stopPropagation();
                            const parentItem = toggle.closest('.category-item');
                            toggleCategoryItem(parentItem);
                        });
                    });
                })
                .catch(() => {
                    document.getElementById('categories-bar').innerHTML = '<a href="./" class="category-link" data-id="home"><img src="https://c.top4top.io/p_3909b9cn40.png" alt="الرئيسية" style="width:42px;height:42px;object-fit:cover;border-radius:12px;background:transparent;"><span>الرئيسية</span></a>';
                    syncStickyBarHeight();
                });
        }

        function syncStickyBarHeight() {
            const categoriesBar = document.getElementById('categories-bar');
            if (categoriesBar) document.documentElement.style.setProperty('--categories-bar-height', `${categoriesBar.offsetHeight}px`);
        }

        document.addEventListener('click', (event) => {
            document.querySelectorAll('.category-item.open').forEach((item) => {
                if (item.contains(event.target)) return;
                item.classList.remove('open');
                const toggle = item.querySelector(':scope > .category-toggle');
                if (toggle) toggle.setAttribute('aria-expanded', 'false');
            });
        });

        function loadArticles() {
            Promise.all([get(ref(db, 'articles')), get(ref(db, 'featuredVideo'))])
                .then(([snapshot, featuredSnapshot]) => {
                    featuredVideo = featuredSnapshot.exists() ? featuredSnapshot.val() || null : null;
                    allArticles = normalizeArticles(snapshot);
                    renderLatestTicker(allArticles);
                    const filtered = allArticles.filter((article) => {
                        const searchableText = `${article.title || ''} ${article.content || ''}`.toLowerCase();
                        const matchesCategory = selectedCategory === 'home'
                            || article.categoryId === selectedCategory;
                        const matchesSearch = !searchTerm || searchableText.includes(searchTerm.toLowerCase());
                        return matchesCategory && matchesSearch;
                    }).sort((first, second) => {
                        if (selectedCategory === 'home' && isPinnedVideo(first) !== isPinnedVideo(second)) {
                            return isPinnedVideo(first) ? -1 : 1;
                        }
                        if (selectedCategory === 'home' && isPinned(first) !== isPinned(second)) {
                            return isPinned(first) ? -1 : 1;
                        }
                        return sortByNewest(first, second);
                    });
                    displayArticles(filtered);
                })
                .catch(() => {
                    renderLatestTicker([]);
                    displayArticles([]);
                });
        }

        const searchArea = document.getElementById('search-area');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.querySelector('.search-btn');
        if (searchButton && searchArea && searchInput) {
            searchButton.addEventListener('click', () => {
                searchArea.classList.toggle('open');
                if (searchArea.classList.contains('open')) searchInput.focus();
            });
            searchInput.value = searchTerm;
            searchArea.addEventListener('submit', (event) => {
                event.preventDefault();
                const query = searchInput.value.trim();
                const params = new URLSearchParams();
                if (selectedCategory !== 'home') params.set('category', selectedCategory);
                if (query) params.set('q', query);
                window.location.href = `./${params.toString() ? '?' + params.toString() : ''}`;
            });
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articles-grid');
            const mainStory = document.getElementById('main-story');
            const subcategoryCards = document.getElementById('subcategory-cards');
            const pagination = document.getElementById('pagination');
            grid.innerHTML = '';
            subcategoryCards.innerHTML = '';
            subcategoryCards.classList.remove('visible');
            pagination.innerHTML = '';

            if (selectedCategory !== 'home') {
                const childCategories = allCategories
                    .filter((category) => category.parentId === selectedCategory)
                    .sort((first, second) => first.name.localeCompare(second.name, 'ar'));
                if (childCategories.length) {
                    subcategoryCards.innerHTML = childCategories.map((category) => {
                        const targetHref = category.url || `./?category=${encodeURIComponent(category.id)}`;
                        return `
                            <a class="subcategory-card" href="${targetHref}">
                                ${category.name}
                            </a>`;
                    }).join('');
                    subcategoryCards.classList.add('visible');
                }
            }

            if (!articles || articles.length === 0) {
                mainStory.style.display = 'none';
                mainStory.innerHTML = '';
                grid.innerHTML = `<p class="empty-state">${selectedCategory === 'home' ? 'لا توجد مواضيع منشورة حاليًا.' : 'لا توجد مواضيع في هذا القسم حاليًا.'}</p>`;
                return;
            }

            const isHomepage = selectedCategory === 'home' && !searchTerm;
            const hasSeparateFeaturedVideo = isHomepage && Boolean(getFeaturedVideoData());
            const homepageFeaturedArticleCount = isHomepage && !hasSeparateFeaturedVideo ? 1 : 0;
            const homepageFirstPageSize = articlesPerPage + homepageFeaturedArticleCount;
            const totalPages = isHomepage
                ? (articles.length <= homepageFirstPageSize
                    ? 1
                    : 1 + Math.ceil((articles.length - homepageFirstPageSize) / articlesPerPage))
                : Math.ceil(articles.length / articlesPerPage);
            const page = Math.min(currentPage, totalPages);
            const pageStart = isHomepage && page > 1
                ? homepageFirstPageSize + ((page - 2) * articlesPerPage)
                : (isHomepage ? 0 : (page - 1) * articlesPerPage);
            const pageSize = isHomepage && page === 1 ? homepageFirstPageSize : articlesPerPage;
            const pageArticles = articles.slice(pageStart, pageStart + pageSize);
            const showMainStory = isHomepage && page === 1;
            const cards = showMainStory
                ? (hasSeparateFeaturedVideo ? pageArticles : pageArticles.slice(1))
                : pageArticles;

            if (showMainStory) {
                const first = pageArticles[0];
                const separateFeaturedVideo = getFeaturedVideoData();
                const featuredArticle = separateFeaturedVideo ? { videoUrl: separateFeaturedVideo.videoUrl } : first;
                const mainTitle = separateFeaturedVideo ? separateFeaturedVideo.title : (first.title || 'عنوان غير متاح');
                const mainImageHtml = getArticleImageHtml(first, mainTitle);
                const featuredVideoHtml = separateFeaturedVideo
                    ? getFeaturedVideoHtml(featuredArticle)
                    : (isPinnedVideo(first) ? getFeaturedVideoHtml(first) : '');
                const mainLink = separateFeaturedVideo ? '' : getArticleHref(first);

                mainStory.style.display = 'block';
                mainStory.innerHTML = `
                    ${featuredVideoHtml || `<a href="${mainLink}" style="text-decoration: none; color: inherit;">${mainImageHtml}</a>`}
                    ${mainLink ? `<a href="${mainLink}" style="text-decoration: none; color: inherit;"><h2>${mainTitle}</h2></a>` : ''}`;
                const featuredUrl = getArticleVideoUrls(featuredArticle)[0];
                if (featuredVideoHtml && !getYoutubeEmbedUrl(featuredUrl)) {
                    setupFeaturedStream(document.getElementById('featured-video-player'), featuredUrl);
                }
            } else {
                mainStory.style.display = 'none';
                mainStory.innerHTML = '';
            }

            cards.forEach((article) => {
                const title = article.title || 'عنوان غير متاح';
                const contentPreview = getArticlePreview(article.content);
                const imageHtml = getArticleImageHtml(article, title);
                const articleHref = getArticleHref(article);

                grid.innerHTML += `
                    <a href="${articleHref}" class="article-card">
                        <div class="article-media">
                            ${imageHtml}
                            <div class="article-overlay">
                                <h3>${escapeHtml(title)}</h3>
                            </div>
                        </div>
                        <div class="article-info">
                            <p>${escapeHtml(contentPreview)}</p>
                        </div>
                    </a>`;
            });

            if (totalPages > 1) {
                for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
                    const params = new URLSearchParams();
                    if (selectedCategory !== 'home') params.set('category', selectedCategory);
                    if (searchTerm) params.set('q', searchTerm);
                    if (pageNumber > 1) params.set('page', pageNumber);
                    const activeClass = pageNumber === page ? ' active' : '';
                    pagination.innerHTML += `<a href="./?${params.toString()}" class="${activeClass.trim()}" aria-label="الصفحة ${pageNumber}">${pageNumber}</a>`;
                }
            }
        }

        loadCategories().then(loadArticles);
        if ('ResizeObserver' in window) new ResizeObserver(syncStickyBarHeight).observe(document.getElementById('categories-bar'));
        window.addEventListener('resize', syncStickyBarHeight);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
        setupInstallPrompt();
        setupThemeToggle();
    </script>
</body>
</html>
